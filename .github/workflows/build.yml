name: Build project

on:
  push:
    branches: [ master, 'features/**' ]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: make frontend-deps

    - name: Verify generated API spec and client are up to date
      run: make gen-check

    - name: Check
      run: make check

    - name: Build
      run: make build

    - name: Runnning build/generation script
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      shell: bash
      run: |
        bash ./release.sh

    - name: Generate tag name
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: echo "TAG_NAME=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
    - name: Generate release title
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: echo "RTITLE=$(git log -n 1 --oneline | cut -d' ' -f2- -)"  >> $GITHUB_ENV

    - name: Upload release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        files: releases/*.zip
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.RTITLE }}
        fail_on_unmatched_files: true
        body_path: release.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete older releases
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: dev-drprasad/delete-older-releases@v0.1.0
      with:
        keep_latest: 7
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
